<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antigoo Verification</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#24103d 0,#09070e 42%,#050509 100%);color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}.card{width:min(92vw,480px);padding:34px 24px;border:1px solid #ffffff18;border-radius:28px;background:#111016dd;box-shadow:0 25px 80px #0009;text-align:center}.icon{font-size:44px;margin-bottom:10px}.sub{color:#a8a3b5;margin:8px 0 26px}.ring{width:150px;height:150px;border-radius:50%;border:2px solid #8b5cf6;display:grid;place-items:center;margin:0 auto 24px;cursor:pointer;box-shadow:0 0 35px #7c3aed55}.ring span{font-weight:700}.bar{height:7px;background:#292530;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#22d3ee);transition:width .2s}.status{margin-top:18px;color:#bbb5c7;font-size:14px}.error{color:#ff6b81}.ok{color:#67e8f9}
</style></head><body><main class="card"><div class="icon">🔐</div><h1>Secure Verification</h1><p class="sub">Hold to verify this link</p><div class="ring" id="ring"><span id="txt">HOLD</span></div><div class="bar"><i id="fill"></i></div><div class="status" id="status">Waiting for verification…</div></main><script>
const ring=document.getElementById('ring'),txt=document.getElementById('txt'),fill=document.getElementById('fill'),status=document.getElementById('status');let timer=null,start=0,proof=0;function begin(){if(timer)return;start=Date.now();proof=Math.floor(Math.random()*900000)+100000;timer=setInterval(()=>{let p=Math.min(1,(Date.now()-start)/3000);fill.style.width=(p*100)+'%';txt.textContent=Math.ceil((1-p)*3)+'s';if(p>=1){clearInterval(timer);timer=null;submit()}},50)}async function submit(){status.textContent='Checking…';try{const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({proof:String(proof)})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.code||'VERIFY');status.className='ok';status.textContent='Verified. Redirecting…';location.href=d.url}catch(e){status.className='error';status.textContent='Verification failed: '+e.message;fill.style.width='0';txt.textContent='RETRY'}}ring.addEventListener('pointerdown',e=>{e.preventDefault();begin()});
</script></body></html>
