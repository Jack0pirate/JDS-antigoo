<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Verification</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08070d;color:#fff;font-family:system-ui}.card{padding:38px 28px;border:1px solid #ffffff18;border-radius:25px;background:#111016;text-align:center;width:min(90vw,430px)}.ok{color:#67e8f9}.bad{color:#ff5870}</style></head><body><main class="card"><h1 id="h">Checking…</h1><p id="p">Validating your return token.</p></main><script>const t=new URLSearchParams(location.search).get('token');if(!t){document.getElementById('h').textContent='Bypass Detected';document.getElementById('p').textContent='Invalid verification link.'}else{setTimeout(()=>location.replace('/api/final?token='+encodeURIComponent(t)),1500)}</script></body></html>
